<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Stream Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #0d1017; color: #d1d4dc; }
        #top {
            padding: 10px 18px; background: #161b22;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2a2e39; position: sticky; top: 0; z-index: 10;
            flex-wrap: wrap; gap: 8px;
        }
        #top .title { font-size: 14px; font-weight: 600; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .ok { background: #26a69a; color: white; }
        .err { background: #ef5350; color: white; }
        .warn { background: #f0a500; color: white; }
        #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .tab {
            padding: 5px 10px; border: 1px solid #2a2e39; border-radius: 4px;
            background: #1e222d; cursor: pointer; font-size: 12px;
        }
        .tab.active { background: #2962ff; border-color: #2962ff; color: white; }
        .tab:hover { border-color: #2962ff; }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 12px;
            padding: 12px;
        }
        .cell {
            background: #161b22;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .cell-head {
            padding: 6px 12px; background: #1e222d;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px;
        }
        .cell-head .asset { font-weight: 700; font-size: 13px; }
        .cell-head .slot { color: #787b86; font-size: 10px; }
        .chart { width: 100%; height: 240px; }
        .cell-foot {
            display: grid; grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid #2a2e39;
        }
        .metric {
            padding: 5px 8px;
            border-right: 1px solid #2a2e39;
            font-size: 11px;
        }
        .metric:last-child { border-right: none; }
        .metric .k { color: #787b86; font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; }
        .metric .v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .pos { color: #26a69a; }
        .neg { color: #ef5350; }
        .neutral { color: #d1d4dc; }
        .warn-y { color: #f0a500; }
    </style>
</head>
<body>
    <div id="top">
        <div class="title" id="title">Multi-Stream Dashboard</div>
        <div id="tabs"></div>
        <div id="status"><span class="badge warn">Connecting...</span></div>
    </div>
    <div id="grid"></div>

    <script>
    const grid = document.getElementById('grid');
    const tabs = document.getElementById('tabs');
    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('title');

    const charts = {};   // asset -> { chart, candleSeries, bbU, bbM, bbL, ema }
    let allAssets = [];
    let activeFilter = 'ALL';
    let initialized = false;

    const fmt = (n, d = 5) => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(d);
    const fmtPct = (n) => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(1) + '%';

    function makeCell(asset, slotId) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.asset = asset;
        cell.dataset.slot = slotId;
        cell.innerHTML = `
            <div class="cell-head">
                <span class="asset">${asset}</span>
                <span class="slot">slot ${slotId}</span>
            </div>
            <div class="chart" id="chart-${asset}"></div>
            <div class="cell-foot">
                <div class="metric"><div class="k">RSI 14</div><div class="v" id="rsi-${asset}">—</div></div>
                <div class="metric"><div class="k">EMA 6</div><div class="v" id="ema-${asset}">—</div></div>
                <div class="metric"><div class="k">% to Up BB</div><div class="v" id="bbu-${asset}">—</div></div>
                <div class="metric"><div class="k">% to Lo BB</div><div class="v" id="bbl-${asset}">—</div></div>
            </div>
        `;
        grid.appendChild(cell);

        const chart = LightweightCharts.createChart(
            cell.querySelector('.chart'),
            {
                layout: { background: { color: '#161b22' }, textColor: '#d1d4dc', fontSize: 10 },
                grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
                timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
                rightPriceScale: { borderColor: '#2a2e39' },
                handleScale: { axisPressedMouseMove: false },
                handleScroll: { pressedMouseMove: false, mouseWheel: false,
